id: HM-AUTH-001
name: Cross-role login recovery after logout
owner: Jarvis
risk: authenticated_cross_role_read_only
starting_state:
  user_role: signed_out
  authentication: signed_out
  test_data_policy: dedicated_non_sensitive_admin_and_member
  required_environment:
    - JARVIS_BASE_URL
    - JARVIS_ADMIN_EMAIL
    - JARVIS_ADMIN_PASSWORD
    - JARVIS_MEMBER_EMAIL
    - JARVIS_MEMBER_PASSWORD
steps:
  - checkpoint: T1
    action: Sign in with the dedicated admin identity
    expected: Admin Dashboard and Logout are visible
  - checkpoint: T2
    action: Log out from the admin session
    expected: A fresh Secure Login form is visible
  - checkpoint: T3
    action: Sign in with the dedicated member identity in the same browser context
    expected: Member Home and Logout are visible
  - checkpoint: T4
    action: Log out from the member session
    expected: A fresh Secure Login form is visible
  - checkpoint: T5
    action: Sign in again with the dedicated admin identity
    expected: Admin Dashboard and Logout are visible without a silent or locked login form
non_regression:
  - Do not use real member or administrator identities
  - Do not open member-detail or health-data pages
  - Do not create, update, submit, allocate, deactivate or delete records
  - Keep every login and logout in one browser context to reproduce the reported regression
  - Preserve role separation and the existing Supabase OIDC authorization flow
artifacts:
  - JSON result report
  - Checkpoint timeline
  - Frame-aware navigation timing
  - Console, page, network and HTTP diagnostics
