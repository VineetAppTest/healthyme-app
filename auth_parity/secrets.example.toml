# Copy only one provider section into each temporary Streamlit app.
# Never commit real values.

# -----------------------------
# Deployment A: Auth0 baseline
# -----------------------------
AUTH_TEST_PROVIDER = "auth0"

[auth]
redirect_uri = "https://<auth0-test-app>.streamlit.app/oauth2callback"
cookie_secret = "<new-long-random-cookie-secret>"

[auth.auth0]
client_id = "<auth0-client-id>"
client_secret = "<auth0-client-secret>"
server_metadata_url = "https://<auth0-domain>/.well-known/openid-configuration"
client_kwargs = { scope = "openid profile email" }

