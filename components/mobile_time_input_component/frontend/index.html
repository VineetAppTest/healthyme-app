<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://unpkg.com/streamlit-component-lib@1.4.0/dist/index.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .hm-wrap {
      box-sizing: border-box;
      width: 100%;
      padding: 0;
    }
    .hm-label {
      color: #064E3B;
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 6px 0;
    }
    .hm-time-input {
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      width: 100%;
      min-height: 46px;
      border: 1.6px solid #D4A63A;
      border-radius: 14px;
      background: #FFFFFF;
      color: #064E3B;
      -webkit-text-fill-color: #064E3B;
      opacity: 1;
      font-size: 17px;
      font-weight: 900;
      padding: 9px 12px;
      outline: none;
      box-shadow: 0 5px 16px rgba(15,23,42,.055);
    }
    .hm-time-input:focus {
      border-color: #0F766E;
      background: #FFFDF8;
      box-shadow: 0 0 0 3px rgba(15,118,110,.14);
    }
    .hm-time-input::-webkit-date-and-time-value {
      color: #064E3B;
      -webkit-text-fill-color: #064E3B;
      text-align: left;
    }
    .hm-time-input::-webkit-calendar-picker-indicator {
      opacity: 1;
      filter: invert(25%) sepia(36%) saturate(897%) hue-rotate(122deg) brightness(89%) contrast(92%);
    }
  </style>
</head>
<body>
  <div class="hm-wrap">
    <div id="label" class="hm-label"></div>
    <input id="timeInput" class="hm-time-input" type="time" inputmode="none" />
  </div>

  <script>
    let input = document.getElementById("timeInput");
    let label = document.getElementById("label");

    function sendValue() {
      Streamlit.setComponentValue(input.value || "");
      Streamlit.setFrameHeight(78);
    }

    function onRender(event) {
      const data = event.detail.args || {};
      label.textContent = data.label || "Select time";
      input.disabled = false;
      input.readOnly = false;
      input.removeAttribute("disabled");
      input.removeAttribute("readonly");
      input.value = data.value || "08:00";
      sendValue();
      input.onchange = sendValue;
      input.oninput = sendValue;
      input.onclick = function(){ try { input.showPicker && input.showPicker(); } catch(e) {} };
      Streamlit.setFrameHeight(78);
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(78);
  </script>
</body>
</html>
