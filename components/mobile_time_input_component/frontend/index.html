<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://unpkg.com/streamlit-component-lib@1.4.0/dist/index.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .hm-wrap {
      box-sizing: border-box;
      width: 100%;
      padding: 0;
    }
    .hm-label {
      color: #064E3B;
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 6px 0;
    }
    .hm-time-input {
      box-sizing: border-box;
      width: 100%;
      min-height: 42px;
      border: 1.4px solid #D9C399;
      border-radius: 14px;
      background: #FFFDF8;
      color: #064E3B;
      font-size: 16px;
      font-weight: 800;
      padding: 8px 12px;
      outline: none;
      box-shadow: 0 4px 14px rgba(15,23,42,.04);
    }
    .hm-time-input:focus {
      border-color: #0F766E;
      box-shadow: 0 0 0 3px rgba(15,118,110,.12);
    }
  </style>
</head>
<body>
  <div class="hm-wrap">
    <div id="label" class="hm-label"></div>
    <input id="timeInput" class="hm-time-input" type="time" />
  </div>

  <script>
    let input = document.getElementById("timeInput");
    let label = document.getElementById("label");

    function sendValue() {
      Streamlit.setComponentValue(input.value || "");
      Streamlit.setFrameHeight(72);
    }

    function onRender(event) {
      const data = event.detail.args || {};
      label.textContent = data.label || "Select time";
      input.value = data.value || "08:00";
      sendValue();
      input.onchange = sendValue;
      input.oninput = sendValue;
      Streamlit.setFrameHeight(72);
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(72);
  </script>
</body>
</html>
