name: Apply Member Home Acknowledgement Presentation Fix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_member_home_acknowledged_hide_expander.py"
      - ".github/workflows/apply-member-home-acknowledged-hide-expander.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/member-home-acknowledged-hide-expander' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/member-home-acknowledged-hide-expander
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact correction
        run: python scripts/apply_member_home_acknowledged_hide_expander.py
      - name: Compile changed surfaces
        run: |
          python -m py_compile \
            components/member_home_schedule_presentation.py \
            pages/02_Member_Home.py \
            tests/test_member_home_schedule_presentation.py
      - name: Run focused schedule validation
        run: python -m unittest tests.test_member_home_schedule_presentation -v
      - name: Commit permanent correction files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/member_home_schedule_presentation.py \
            pages/02_Member_Home.py \
            tests/test_member_home_schedule_presentation.py
          git commit -m "Hide acknowledged Member Home schedules and restore disclosure"
          git push origin HEAD:fix/member-home-acknowledged-hide-expander
