name: Apply optimized inline repository rollback

on:
  push:
    branches:
      - fix/optimized-inline-repository-forms
    paths:
      - scripts/apply_optimized_inline_repository_rollback.py
      - .github/workflows/apply-optimized-inline-repository-rollback.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/optimized-inline-repository-forms
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply rollback and optimized inline architecture
        run: python scripts/apply_optimized_inline_repository_rollback.py
      - name: Remove one-time transformer
        run: |
          rm -f scripts/apply_optimized_inline_repository_rollback.py
          rm -f .github/workflows/apply-optimized-inline-repository-rollback.yml
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore optimized inline repository forms"
          git push origin HEAD:fix/optimized-inline-repository-forms
