name: Restore PR329 repository UI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/restore-pr329-repository-ui.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore repository UI files from PR329
        run: |
          git checkout d51e91a3f3016793d1fdd4f610bc6bc7f8ca5f76 -- \
            components/__init__.py \
            components/repository_create_form_success.py \
            components/repository_layout_correction_runtime.py \
            pages/15_Admin_Recipe_Manager.py \
            pages/16_Admin_Exercise_Manager.py \
            pages/39_Admin_Supplement_Manager.py \
            tests/test_repository_compact_ui.py \
            tests/test_repository_consolidation.py \
            tests/test_repository_create_form_success.py \
            tests/test_repository_layout_correction_runtime.py

      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components pages tests
          if git diff --cached --quiet; then
            echo "Repository UI already matches PR329."
            exit 0
          fi
          git commit -m "Restore repository UI to PR329"
          git push origin HEAD:${{ github.head_ref }}
