name: Member Planning separation contract validation

on:
  pull_request:
    paths:
      - "components/member_planning_separation_contract.py"
      - "docs/member_planning_separation_contract_2026-08-03.md"
      - "tests/test_member_planning_separation_contract.py"
      - ".github/workflows/member-planning-separation-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile contract and guards
        run: |
          python -m py_compile \
            components/member_planning_separation_contract.py \
            tests/test_member_planning_separation_contract.py

      - name: Run Member Planning separation guards
        run: python -m unittest tests.test_member_planning_separation_contract -v
