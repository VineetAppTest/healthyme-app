name: P0 Member Authority Contract v2

on:
  pull_request:
    paths:
      - "components/exercise_member_allocation.py"
      - "components/member_exercise_journal.py"
      - "components/member_exercise_journal_table.py"
      - "components/member_exercise_journal_layout_v4.py"
      - "components/current_member_plan.py"
      - "sql/p0_member_exercise_log_allocation_identity_v2.sql"
      - "docs/P0_MEMBER_AUTHORITY_CONTRACT_V2.md"
      - "tests/test_p0_member_authority_contract_v2.py"
      - "tests/test_member_schedule_tabs_exercise_journal.py"
      - "tests/test_current_member_plan.py"
      - "tests/test_exercise_member_allocation.py"
      - ".github/workflows/p0-member-authority-contract-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile P0 contract surfaces
        run: |
          python -m py_compile \
            components/exercise_member_allocation.py \
            components/member_exercise_journal.py \
            components/member_exercise_journal_table.py \
            components/member_exercise_journal_layout_v4.py \
            tests/test_p0_member_authority_contract_v2.py

      - name: Run focused authority and journal regressions
        run: |
          python -m unittest -v \
            tests.test_p0_member_authority_contract_v2 \
            tests.test_current_member_plan \
            tests.test_exercise_member_allocation \
            tests.test_member_schedule_tabs_exercise_journal
