name: Apply Authenticated Smoke Corrections

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_authenticated_smoke_corrections.py"
      - "scripts/update_authenticated_smoke_test_contracts.py"
      - ".github/workflows/apply-authenticated-smoke-corrections.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/authenticated-smoke-corrections-live' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/authenticated-smoke-corrections-live
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply authenticated smoke corrections
        run: |
          python scripts/apply_authenticated_smoke_corrections.py
          python scripts/update_authenticated_smoke_test_contracts.py
      - name: Compile changed Python surfaces
        run: |
          python -m py_compile \
            components/member_plan_builder_setup.py \
            components/member_plan_builder_meals_compact.py \
            components/profile_builder_modular.py \
            components/member_plan_builder_view_compact.py \
            components/admin_schedule_feedback_aug04.py \
            components/member_home_global_header_runtime.py \
            components/member_home_schedule_presentation.py \
            pages/02_Member_Home.py \
            pages/15_Admin_Recipe_Manager.py \
            pages/16_Admin_Exercise_Manager.py \
            pages/18_Daily_Log.py \
            pages/38_Admin_Recommendation_Profile_Builder.py \
            pages/39_Admin_Supplement_Manager.py \
            tests/test_authenticated_smoke_corrections.py \
            tests/test_streamlit_ui_consistency_batch.py \
            tests/test_food_journal_meal_grid_saved_days_cleanup.py \
            tests/test_member_home_global_header_runtime.py \
            tests/test_member_home_schedule_presentation.py
      - name: Run focused correction contracts
        run: |
          python -m unittest \
            tests.test_authenticated_smoke_corrections \
            tests.test_streamlit_ui_consistency_batch \
            tests.test_food_journal_meal_grid_saved_days_cleanup \
            tests.test_member_home_global_header_runtime \
            tests.test_member_home_schedule_presentation \
            tests.test_meal_profile_builder_phase_b \
            tests.test_feedback_scheduling_notifications_task_age \
            tests.test_repository_layout_correction_runtime \
            tests.test_member_journal_server_autosave \
            -v
      - name: Commit permanent corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/member_plan_builder_setup.py \
            components/member_plan_builder_meals_compact.py \
            components/profile_builder_modular.py \
            components/member_plan_builder_view_compact.py \
            components/admin_schedule_feedback_aug04.py \
            components/member_home_global_header_runtime.py \
            components/member_home_schedule_presentation.py \
            pages/02_Member_Home.py \
            pages/15_Admin_Recipe_Manager.py \
            pages/16_Admin_Exercise_Manager.py \
            pages/18_Daily_Log.py \
            pages/38_Admin_Recommendation_Profile_Builder.py \
            pages/39_Admin_Supplement_Manager.py \
            tests/test_authenticated_smoke_corrections.py \
            tests/test_streamlit_ui_consistency_batch.py \
            tests/test_food_journal_meal_grid_saved_days_cleanup.py \
            tests/test_member_home_global_header_runtime.py \
            tests/test_member_home_schedule_presentation.py
          git commit -m "Apply authenticated Streamlit smoke corrections"
          git push origin HEAD:fix/authenticated-smoke-corrections-live
