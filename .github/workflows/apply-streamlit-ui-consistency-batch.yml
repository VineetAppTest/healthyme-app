name: Apply Streamlit UI Consistency Batch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_streamlit_ui_consistency_batch.py"
      - ".github/workflows/apply-streamlit-ui-consistency-batch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/streamlit-ui-consistency-batch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/streamlit-ui-consistency-batch
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact UI consistency corrections
        run: python scripts/apply_streamlit_ui_consistency_batch.py
      - name: Compile corrected surfaces
        run: |
          python -m py_compile \
            components/member_journal_server_autosave.py \
            components/repository_layout_correction_runtime.py \
            components/profile_builder_modular.py \
            components/member_plan_builder_view_compact.py \
            pages/18_Daily_Log.py \
            tests/test_member_journal_server_autosave.py \
            tests/test_streamlit_ui_consistency_batch.py
      - name: Run focused correction tests
        run: |
          python -m unittest \
            tests.test_member_journal_server_autosave \
            tests.test_streamlit_ui_consistency_batch \
            tests.test_food_journal_meal_grid_saved_days_cleanup \
            tests.test_repository_layout_correction_runtime \
            tests.test_repository_exclusive_tabs_runtime \
            tests.test_issue_260_profile_builder_ui_cleanup \
            -v
      - name: Commit permanent correction files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/streamlit-ui-consistency-batch-validation.yml \
            components/member_journal_server_autosave.py \
            components/repository_layout_correction_runtime.py \
            components/profile_builder_modular.py \
            components/member_plan_builder_view_compact.py \
            pages/18_Daily_Log.py \
            tests/test_member_journal_server_autosave.py \
            tests/test_streamlit_ui_consistency_batch.py
          git commit -m "Apply Streamlit UI consistency corrections"
          git push origin HEAD:fix/streamlit-ui-consistency-batch
