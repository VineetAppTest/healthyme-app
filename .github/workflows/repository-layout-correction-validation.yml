name: Repository layout correction validation

on:
  pull_request:
    paths:
      - 'components/repository_layout_correction_runtime.py'
      - 'components/__init__.py'
      - 'tests/test_repository_layout_correction_runtime.py'
      - '.github/workflows/repository-layout-correction-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile runtime and bootstrap
        run: |
          python -m py_compile \
            components/repository_layout_correction_runtime.py \
            components/__init__.py \
            tests/test_repository_layout_correction_runtime.py

      - name: Run repository layout contracts
        run: python -m unittest tests.test_repository_layout_correction_runtime -v
