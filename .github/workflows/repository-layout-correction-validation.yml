name: Repository layout correction validation

on:
  pull_request:
    paths:
      - 'components/repository_layout_correction_runtime.py'
      - 'components/__init__.py'
      - 'pages/15_Admin_Recipe_Manager.py'
      - 'pages/16_Admin_Exercise_Manager.py'
      - 'pages/39_Admin_Supplement_Manager.py'
      - 'tests/test_repository_layout_correction_runtime.py'
      - 'tests/test_*repository*.py'
      - 'tests/test_*supplement*.py'
      - 'tests/test_*exercise*.py'
      - '.github/workflows/repository-layout-correction-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile runtime, bootstrap and repository pages
        run: |
          python -m py_compile \
            components/repository_layout_correction_runtime.py \
            components/__init__.py \
            pages/15_Admin_Recipe_Manager.py \
            pages/16_Admin_Exercise_Manager.py \
            pages/39_Admin_Supplement_Manager.py \
            tests/test_repository_layout_correction_runtime.py

      - name: Run focused layout contract
        run: python -m unittest tests.test_repository_layout_correction_runtime -v

      - name: Run repository regression contracts
        run: python -m unittest discover -s tests -p 'test_*repository*.py' -v

      - name: Run supplement regression contracts
        run: python -m unittest discover -s tests -p 'test_*supplement*.py' -v

      - name: Run exercise regression contracts
        run: python -m unittest discover -s tests -p 'test_*exercise*.py' -v
