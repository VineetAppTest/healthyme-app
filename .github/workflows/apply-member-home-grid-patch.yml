name: Apply Member Home Grid Patch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_member_home_grid_patch.py"
      - "scripts/fix_member_home_grid_patch_test.py"
      - ".github/workflows/apply-member-home-grid-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/compact-member-home-grids-fluid-time' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/compact-member-home-grids-fluid-time
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact UI patch
        run: |
          python scripts/apply_member_home_grid_patch.py
          python scripts/fix_member_home_grid_patch_test.py
      - name: Compile modified surfaces
        run: |
          python -m py_compile \
            pages/02_Member_Home.py \
            pages/18_Daily_Log.py \
            components/member_home_schedule_presentation.py \
            tests/test_member_home_schedule_presentation.py
      - name: Run focused validation
        run: python -m unittest tests.test_member_home_schedule_presentation -v
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pages/02_Member_Home.py \
            pages/18_Daily_Log.py \
            components/member_home_schedule_presentation.py \
            tests/test_member_home_schedule_presentation.py \
            .github/workflows/member-home-schedule-actions.yml
          git commit -m "[ui-patch-applied] Compact Member Home grids and fluid time controls"
          git push origin HEAD:agent/compact-member-home-grids-fluid-time
