name: Food Saved Days Presentation Validation

on:
  pull_request:
    paths:
      - "components/food_saved_days_presentation.py"
      - "pages/18_Daily_Log.py"
      - "tests/test_food_saved_days_presentation.py"
      - ".github/workflows/food-saved-days-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile saved-days surfaces
        run: |
          python -m py_compile \
            components/food_saved_days_presentation.py \
            pages/18_Daily_Log.py \
            tests/test_food_saved_days_presentation.py
      - name: Validate Food Journal saved-days contracts
        run: python -m unittest tests.test_food_saved_days_presentation -v
