name: Profile Builder Phase 2 canonical reads validation

on:
  pull_request:
    paths:
      - 'components/profile_builder_canonical_sources.py'
      - 'components/profile_builder_canonical_repository_runtime.py'
      - 'components/profile_builder_module_store_canonical.py'
      - 'components/profile_builder_modular.py'
      - 'components/pbm_core.py'
      - 'components/pbm_rows.py'
      - 'pages/38_Admin_Recommendation_Profile_Builder.py'
      - 'tests/test_profile_builder_phase2_canonical_reads.py'
      - 'tests/test_profile_builder_phase2_legacy_snapshot_save.py'
      - 'docs/profile_builder_phase2_canonical_reads.md'
      - '.github/workflows/profile-builder-phase2-canonical-reads-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Phase 2 Builder files
        run: |
          python -m py_compile \
            components/profile_builder_canonical_sources.py \
            components/profile_builder_canonical_repository_runtime.py \
            components/profile_builder_module_store_canonical.py \
            components/profile_builder_modular.py \
            components/pbm_core.py \
            components/pbm_rows.py \
            pages/38_Admin_Recommendation_Profile_Builder.py \
            tests/test_profile_builder_phase2_canonical_reads.py \
            tests/test_profile_builder_phase2_legacy_snapshot_save.py

      - name: Run Phase 2 canonical source contracts
        run: |
          python -m unittest \
            tests.test_profile_builder_phase2_canonical_reads \
            tests.test_profile_builder_phase2_legacy_snapshot_save \
            -v

      - name: Run Phase 1 repository contract regression
        run: python -m unittest tests.test_profile_builder_repository_contract -v

      - name: Run existing Profile Builder form hygiene regression
        run: python -m unittest tests.test_profile_builder_form_hygiene -v
