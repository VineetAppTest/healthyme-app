name: Update Member Plan Expander Acceptance

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/update_member_plan_expander_acceptance.py"
      - ".github/workflows/update-member-plan-expander-acceptance.yml"

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.pull_request.head.ref == 'fix/streamlit-ui-consistency-batch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/streamlit-ui-consistency-batch
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update stale disclosure acceptance contract
        run: python scripts/update_member_plan_expander_acceptance.py
      - name: Run affected acceptance test
        run: python -m unittest tests.test_meal_profile_builder_phase_b -v
      - name: Commit permanent acceptance correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_meal_profile_builder_phase_b.py
          git commit -m "Align Member Plan disclosure acceptance with full labels"
          git push origin HEAD:fix/streamlit-ui-consistency-batch
