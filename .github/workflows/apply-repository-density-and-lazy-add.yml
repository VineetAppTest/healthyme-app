name: Apply repository density and lazy Add

on:
  push:
    branches:
      - fix/repository-density-and-lazy-add
    paths:
      - scripts/apply_repository_density_and_lazy_add.py
      - .github/workflows/apply-repository-density-and-lazy-add.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repository-density-and-lazy-add
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply page transformation
        run: python scripts/apply_repository_density_and_lazy_add.py
      - name: Compile affected files
        run: |
          python -m py_compile \
            components/repository_page_ui.py \
            pages/15_Admin_Recipe_Manager.py \
            pages/16_Admin_Exercise_Manager.py \
            pages/39_Admin_Supplement_Manager.py
      - name: Remove one-time transformation files
        run: |
          rm scripts/apply_repository_density_and_lazy_add.py
          rm .github/workflows/apply-repository-density-and-lazy-add.yml
      - name: Commit transformed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Lazy-render repository Add forms"
          git push origin HEAD:fix/repository-density-and-lazy-add
