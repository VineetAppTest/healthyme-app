name: Jarvis Playwright QC

on:
  pull_request:
    paths:
      - "qa/jarvis/**"
      - ".github/workflows/jarvis-playwright-qc.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Jarvis route suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - public
          - member
          - admin
      base_url:
        description: "Optional HealthyMe environment URL override"
        required: false
        default: ""
        type: string
      environment:
        description: "Environment classification"
        required: true
        default: "uat"
        type: choice
        options:
          - uat
          - production
      access_mode:
        description: "Read-only or controlled mutation"
        required: true
        default: "read_only"
        type: choice
        options:
          - read_only
          - mutation
      privacy_mode:
        description: "Strict creates no media; diagnostic keeps failure media only on the ephemeral runner"
        required: true
        default: "strict"
        type: choice
        options:
          - strict
          - diagnostic
      require_authenticated:
        description: "Fail preflight when requested role credentials are unavailable"
        required: true
        default: false
        type: boolean
      mutation_approved:
        description: "Explicit approval for a route-manifested UAT mutation run"
        required: true
        default: false
        type: boolean
      production_read_only_approved:
        description: "Explicit approval for read-only production validation"
        required: true
        default: false
        type: boolean
      deploy_intent:
        description: "Evaluate deployment eligibility; Jarvis never deploys"
        required: true
        default: false
        type: boolean
      owner_deploy_approval:
        description: "Record Vineet approval for deployment eligibility"
        required: true
        default: false
        type: boolean

concurrency:
  group: jarvis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qa/jarvis
    env:
      JARVIS_BASE_URL: ${{ inputs.base_url || vars.JARVIS_BASE_URL || 'https://healthymeappbyankita.streamlit.app' }}
      JARVIS_MEMBER_EMAIL: ${{ secrets.JARVIS_MEMBER_EMAIL }}
      JARVIS_MEMBER_PASSWORD: ${{ secrets.JARVIS_MEMBER_PASSWORD }}
      JARVIS_ADMIN_EMAIL: ${{ secrets.JARVIS_ADMIN_EMAIL }}
      JARVIS_ADMIN_PASSWORD: ${{ secrets.JARVIS_ADMIN_PASSWORD }}
      JARVIS_SUITE: ${{ github.event_name == 'pull_request' && 'admin' || inputs.suite || 'all' }}
      JARVIS_ENVIRONMENT: ${{ inputs.environment || 'uat' }}
      JARVIS_ACCESS_MODE: ${{ github.event_name == 'pull_request' && vars.JARVIS_MUTATION_ENABLED == 'true' && 'mutation' || inputs.access_mode || 'read_only' }}
      JARVIS_PRIVACY_MODE: ${{ inputs.privacy_mode || 'strict' }}
      JARVIS_REQUIRE_AUTH: ${{ inputs.require_authenticated || 'false' }}
      JARVIS_MUTATION_ENABLED: ${{ vars.JARVIS_MUTATION_ENABLED || 'false' }}
      JARVIS_MUTATION_APPROVED: ${{ github.event_name == 'pull_request' && vars.JARVIS_MUTATION_ENABLED == 'true' && 'true' || inputs.mutation_approved || 'false' }}
      JARVIS_PRODUCTION_READ_ONLY_APPROVED: ${{ inputs.production_read_only_approved || 'false' }}
      JARVIS_DEPLOY_INTENT: ${{ inputs.deploy_intent || 'false' }}
      JARVIS_OWNER_DEPLOY_APPROVAL: ${{ inputs.owner_deploy_approval || 'false' }}
      JARVIS_MUTATION_NAMESPACE: jarvis_uat
      JARVIS_RUN_ID: jarvis-${{ github.run_id }}-${{ github.run_attempt }}
      JARVIS_GIT_SHA: ${{ github.sha }}
      JARVIS_GITHUB_EVENT: ${{ github.event_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa/jarvis/package-lock.json

      - name: Install Jarvis dependencies
        run: npm ci

      - name: Check critical dependency vulnerabilities
        run: npm audit --audit-level=critical

      - name: Type-check Jarvis
        run: npm run typecheck

      - name: Validate Jarvis UAT policy and synthetic fixture
        run: npm run validate:policy

      - name: Run Jarvis security preflight
        run: npm run preflight

      - name: Prepare ephemeral UAT run context
        run: npm run prepare:uat

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute approved Jarvis routes
        run: |
          case "$JARVIS_SUITE" in
            public) npm run test:public ;;
            member) npm run test:member ;;
            admin) npm run test:admin ;;
            all) npm test ;;
            *) echo "Unsupported suite: $JARVIS_SUITE" >&2; exit 1 ;;
          esac

      - name: Verify evidence contains no identifiable information
        if: always()
        run: npm run verify:evidence

      - name: Write de-identified GitHub job summary
        if: always()
        run: npm run summary:safe

      - name: Verify synthetic UAT data cleanup
        if: always()
        run: npm run verify:cleanup

      - name: Delete all temporary Jarvis evidence
        if: always()
        run: npm run cleanup:evidence

      - name: Evaluate deployment gate without deploying
        id: deploy_gate
        if: always()
        run: npm run gate:deploy
