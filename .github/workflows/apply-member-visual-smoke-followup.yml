name: Apply Member Visual Smoke Follow-up

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_member_visual_smoke_followup.py"
      - "tests/test_member_visual_smoke_followup.py"
      - ".github/workflows/apply-member-visual-smoke-followup.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/member-visual-smoke-followup-aug05' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/member-visual-smoke-followup-aug05
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact member visual patch
        run: python scripts/apply_member_visual_smoke_followup.py
      - name: Compile changed Python surfaces
        run: |
          python -m py_compile \
            components/member_home_global_header_runtime.py \
            components/member_home_schedule_presentation.py \
            components/food_saved_days_presentation.py \
            components/schedule_timezone_ui.py \
            pages/02_Member_Home.py \
            pages/18_Daily_Log.py \
            tests/test_member_visual_smoke_followup.py
      - name: Run focused member visual contracts
        run: python -m unittest tests.test_member_visual_smoke_followup -v
      - name: Commit permanent application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/member_home_global_header_runtime.py \
            components/member_home_schedule_presentation.py \
            components/food_saved_days_presentation.py \
            components/schedule_timezone_ui.py \
            pages/02_Member_Home.py \
            pages/18_Daily_Log.py
          git commit -m "Refine member visual smoke surfaces"
          git push origin HEAD:fix/member-visual-smoke-followup-aug05
