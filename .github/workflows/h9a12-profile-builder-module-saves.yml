        use_container_width=True,
        disabled=not ready or not STORE_STATUS.get("ok"),
    ):
        module_rows = [
            row for row in collect_items(include_unsupported=False)
            if row.get("item_type") == kind and item_has_content(row)
        ]
        ok, message = save_profile_module(
            profile_id,
            member_id,
            kind,
            module_rows,
            created_by_user_id=st.session_state.get("user_id", ""),
            created_by_email=st.session_state.get("user_email", ""),
        )
        if ok:
            cached_drafts.clear()
            cached_profile_sources.clear()
            st.success(message)
        else:
            st.error(message)
