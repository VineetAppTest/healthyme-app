name: H9A12 integrate Profile Builder module saves

on:
  push:
    branches:
      - profile-builder-module-saves

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[h9a12-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-builder-module-saves
          fetch-depth: 0

      - name: Apply module-specific save workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          store_path = Path('components/recommendation_profile_store.py')
          store = store_path.read_text(encoding='utf-8')
          anchor = '\ndef save_draft_profile(profile: Dict[str, Any], items: List[Dict[str, Any]]) -> Tuple[bool, str, str]:\n'
          if anchor not in store:
              raise SystemExit('Store insertion anchor not found')

          store_insert = r'''

def list_draft_profiles_for_member(member_id: str, limit: int = 100) -> Tuple[bool, List[dict], str]:
    """Load only draft profiles assigned to one member for module editing."""
    clean_member_id = _clean(member_id)
    if not clean_member_id:
        return False, [], "Select a member first."
    if not check_profile_builder_store().get("ok"):
        return False, [], "Profile Builder tables are not ready."
    try:
        result = (
            _client()
            .table(PROFILE_TABLE)
            .select("id,profile_name,status,assigned_member_id,assigned_member_label,updated_at")
            .eq("status", "draft")
            .eq("assigned_member_id", clean_member_id)
            .order("updated_at", desc=True)
            .limit(limit)
            .execute()
        )
        return True, _rows(result), "Loaded member-specific draft profiles."
    except Exception as exc:
        return False, [], f"Could not load member-specific draft profiles: {exc}"


def _profile_shell_row(profile: Dict[str, Any], profile_id: str, now: str) -> Dict[str, Any]:
    return {
        "id": profile_id,
        "profile_name": _clean(profile.get("profile_name")),
        "status": "draft",
        "region": _clean(profile.get("region")),
        "age_band": _clean(profile.get("age_band")),
        "diet_type": _clean(profile.get("diet_type")),
        "health_concerns": list(profile.get("health_concerns") or []),
        "profile_note": _clean(profile.get("profile_note")),
        "change_note": _clean(profile.get("change_note")),
        "cycle_rule": _clean(profile.get("cycle_rule"), "Weekly cyclical until replaced or stopped"),
        "assigned_member_id": _clean(profile.get("assigned_member_id")),
        "assigned_member_label": _clean(profile.get("assigned_member_label")),
        "start_date": _none_if_blank(profile.get("start_date")),
        "clone_source_profile_id": _optional_uuid(profile.get("clone_source_profile_id")),
        "clone_source_label": _clean(profile.get("clone_source_label")),
        "updated_at": now,
        "created_by_user_id": _clean(profile.get("created_by_user_id")),
        "created_by_email": _clean(profile.get("created_by_email")),
    }


def _module_item_rows(profile_id: str, item_type: str, items: List[Dict[str, Any]], now: str) -> Tuple[List[dict], int]:
    snapshot_columns_ready = profile_source_snapshot_columns_ready()
    item_rows: List[dict] = []
    snapshot_count = 0
    for item in items:
        current_type = _clean(item.get("item_type"))
        if current_type != item_type:
            continue
        day_number = int(item.get("day_number") or 0)
        slot_name = _clean(item.get("slot_name"))
        reference_label = _clean(item.get("reference_label"))
        instruction = _clean(item.get("instruction"))
        if not (1 <= day_number <= 7) or not slot_name:
            continue
        if reference_label.startswith("-- Select"):
            reference_label = ""
        if not any([
            reference_label,
            _clean(item.get("portion")),
            instruction,
            _clean(item.get("scheduled_time")),
            _clean(item.get("intensity")),
            _clean(item.get("dosage_frequency")),
        ]):
            continue
        item_row = {
            "id": str(uuid.uuid4()),
            "profile_id": profile_id,
            "item_type": current_type,
            "day_number": day_number,
            "slot_name": slot_name,
            "item_order": int(item.get("item_order") or 1),
            "reference_label": reference_label,
            "portion": _clean(item.get("portion")),
            "instruction": instruction,
            "scheduled_time": _clean(item.get("scheduled_time")),
            "intensity": _clean(item.get("intensity")),
            "dosage_frequency": _clean(item.get("dosage_frequency")),
            "updated_at": now,
        }
        if snapshot_columns_ready and reference_label:
            source_payload = _source_payload_for_item(_item_type_for_source_lookup(current_type), reference_label)
            if source_payload:
                overrides = dict(item.get("source_admin_overrides") or {})
                if overrides:
                    snapshot = dict(source_payload.get("source_snapshot") or {})
                    snapshot["admin_source_overrides"] = overrides
                    source_payload["source_snapshot"] = snapshot
                item_row.update(source_payload)
                snapshot_count += 1
        item_rows.append(item_row)
    return item_rows, snapshot_count


def save_profile_shell(profile: Dict[str, Any]) -> Tuple[bool, str, str]:
    """Create/update profile-level fields without touching recommendation rows."""
    status = check_profile_builder_store()
    if not status.get("ok"):
        return False, "", status.get("message", "Profile Builder tables are not ready.")
    profile_name = _clean(profile.get("profile_name"))
    if not profile_name:
        return False, "", "Profile Name is required before saving Setup."
    profile_id = _clean(profile.get("id")) or str(uuid.uuid4())
    now = _now_iso()
    row = _profile_shell_row(profile, profile_id, now)
    try:
        c = _client()
        c.table(PROFILE_TABLE).upsert(row, on_conflict="id").execute()
        c.table(EVENT_TABLE).insert({
            "id": str(uuid.uuid4()),
            "profile_id": profile_id,
            "event_type": "profile_setup_saved",
            "event_note": "Profile Setup saved. Recommendation module rows were not changed.",
            "created_by_user_id": row.get("created_by_user_id"),
            "created_by_email": row.get("created_by_email"),
            "created_at": now,
        }).execute()
        return True, profile_id, "Profile Setup saved successfully. Meals, Exercise and Supplements were not changed."
    except Exception as exc:
        return False, profile_id, f"Could not save Profile Setup: {exc}"


def save_profile_module(
    profile_id: str,
    member_id: str,
    item_type: str,
    items: List[Dict[str, Any]],
    created_by_user_id: str = "",
    created_by_email: str = "",
) -> Tuple[bool, str]:
    """Replace only one recommendation module for a member-owned draft profile."""
    clean_profile_id = _clean(profile_id)
    clean_member_id = _clean(member_id)
    if item_type not in {"meal", "exercise", "supplement"}:
        return False, "Unsupported Profile Builder module."
    if not clean_profile_id or not clean_member_id:
        return False, "Select and load a member-specific draft profile first."
    try:
        c = _client()
        profile_result = (
            c.table(PROFILE_TABLE)
            .select("id,status,assigned_member_id,profile_name")
            .eq("id", clean_profile_id)
            .limit(1)
            .execute()
        )
        profiles = _rows(profile_result)
        if not profiles:
            return False, "Selected profile was not found."
        profile = profiles[0]
        if _clean(profile.get("status")).lower() != "draft":
            return False, "Only Draft profiles can be edited."
        if _clean(profile.get("assigned_member_id")) != clean_member_id:
            return False, "Selected profile does not belong to the selected member."
        now = _now_iso()
        item_rows, snapshot_count = _module_item_rows(clean_profile_id, item_type, items, now)
        if not item_rows:
            return False, "Add at least one completed row before saving this module. Existing saved rows were not changed."
        c.table(ITEM_TABLE).delete().eq("profile_id", clean_profile_id).eq("item_type", item_type).execute()
        c.table(ITEM_TABLE).insert(item_rows).execute()
        c.table(PROFILE_TABLE).update({"updated_at": now}).eq("id", clean_profile_id).execute()
        c.table(EVENT_TABLE).insert({
            "id": str(uuid.uuid4()),
            "profile_id": clean_profile_id,
            "event_type": f"{item_type}_module_saved",
            "event_note": f"Saved {len(item_rows)} {item_type} row(s) with {snapshot_count} source snapshot(s). Other modules were not changed.",
            "created_by_user_id": _clean(created_by_user_id),
            "created_by_email": _clean(created_by_email),
            "created_at": now,
        }).execute()
        label = {"meal": "Meals", "exercise": "Exercise", "supplement": "Supplements"}[item_type]
        return True, f"{label} saved successfully with {len(item_rows)} row(s). Other modules were not changed."
    except Exception as exc:
        return False, f"Could not save {item_type} module: {exc}"
'''
