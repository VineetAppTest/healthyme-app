MODULE_SECTION_LABELS = {
    "meal": ("Meals", "Meal Structure"),
    "exercise": ("Exercise", "Exercise Regime"),
    "supplement": ("Supplements", "Supplement Regime"),
}


def load_module_profile_action(profile_id: str, section_name: str):
    if not profile_id:
        return
    ok, profile_payload, item_payload, message = load_profile(profile_id)
    if ok:
        apply_profile_to_session(profile_payload, item_payload)
        st.session_state["v4_active_section"] = section_name
        st.session_state["module_action_message"] = message
    else:
        st.session_state["module_error_message"] = message


def render_module_profile_selector(kind: str):
    label, section_name = MODULE_SECTION_LABELS[kind]
    member_options, member_message = cached_members()
    member_labels = [row["label"] for row in member_options]
    member_label_to_id = {row["label"]: row["id"] for row in member_options}
    if SELECT_MEMBER not in member_label_to_id:
        member_labels = [SELECT_MEMBER] + member_labels
        member_label_to_id[SELECT_MEMBER] = ""

    member_key = f"pb_module_member_{kind}"
    profile_key = f"pb_module_profile_{kind}"
    current_member = st.session_state.get("pb_profile", {}).get("member", SELECT_MEMBER)
    if member_key not in st.session_state:
        st.session_state[member_key] = current_member if current_member in member_labels else SELECT_MEMBER
    if st.session_state[member_key] not in member_labels:
        st.session_state[member_key] = SELECT_MEMBER

    selected_member_label = st.selectbox(
        f"{label} Member",
        member_labels,
        key=member_key,
        help="Select the member first. The Profile list is filtered to this member.",
    )
    selected_member_id = member_label_to_id.get(selected_member_label, "")

    profile_options = ["-- Select draft profile --"]
    profile_label_to_id = {profile_options[0]: ""}
    profile_message = "Select a member to load that member's draft profiles."
    if selected_member_id:
        ok_profiles, profiles, profile_message = list_draft_profiles_for_member(selected_member_id)
        if ok_profiles:
            for profile in profiles:
                profile_label = f"{profile.get('profile_name', 'Untitled')} · {str(profile.get('updated_at', ''))[:16]}"
                profile_options.append(profile_label)
                profile_label_to_id[profile_label] = profile.get("id", "")
    if profile_key not in st.session_state or st.session_state[profile_key] not in profile_options:
        st.session_state[profile_key] = profile_options[0]

    selector_cols = st.columns([0.48, 0.34, 0.18], gap="medium")
    with selector_cols[0]:
        st.caption(f"Member source: {member_message}")
    with selector_cols[1]:
        selected_profile_label = st.selectbox(f"{label} Profile", profile_options, key=profile_key)
    selected_profile_id = profile_label_to_id.get(selected_profile_label, "")
    with selector_cols[2]:
        st.markdown("<div class='hm-load-label'>&nbsp;</div>", unsafe_allow_html=True)
        st.button(
            "Load Profile",
            key=f"pb_module_load_{kind}",
            use_container_width=True,
            disabled=not bool(selected_profile_id),
            on_click=load_module_profile_action,
            args=(selected_profile_id, section_name),
        )
    st.caption(profile_message)

    action_message = st.session_state.pop("module_action_message", "")
    error_message = st.session_state.pop("module_error_message", "")
    if action_message:
        st.success(action_message)
    if error_message:
        st.error(error_message)

    loaded_profile = st.session_state.get("pb_profile", {})
    loaded_profile_id = str(loaded_profile.get("id") or "")
    loaded_member = str(loaded_profile.get("member") or "")
    ready = bool(
        selected_member_id
        and selected_profile_id
        and loaded_profile_id == selected_profile_id
        and loaded_member == selected_member_label
    )
    if ready:
        st.markdown(
            f"<div class='hm-readiness-strip hm-ready-ok'><b>{label} profile loaded.</b> "
            f"{loaded_profile.get('profile_name', 'Draft')} · {selected_member_label}</div>",
            unsafe_allow_html=True,
        )
    else:
        st.info(f"Select Member and Profile, then click Load Profile before editing or saving {label}.")
    return ready, selected_member_id, selected_profile_id


def render_module_save(kind: str, ready: bool, member_id: str, profile_id: str):
    label, _section_name = MODULE_SECTION_LABELS[kind]
    if st.button(
        f"Save {label}",
