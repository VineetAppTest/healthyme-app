name: Flutter Workflow RPC permission hardening validation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260803144800_harden_flutter_workflow_rpc_permissions.sql"
      - "supabase/migrations/20260803145200_restrict_flutter_member_rpc_execution.sql"
      - "docs/flutter_workflow_rpc_permission_hardening_gate1_2026-08-03.md"
      - "tests/test_flutter_workflow_rpc_permission_hardening_gate1.py"
      - ".github/workflows/flutter-workflow-rpc-permission-hardening-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Gate 1 contract
        run: python -m py_compile tests/test_flutter_workflow_rpc_permission_hardening_gate1.py

      - name: Validate Flutter Workflow RPC hardening
        run: python -m unittest tests.test_flutter_workflow_rpc_permission_hardening_gate1 -v
