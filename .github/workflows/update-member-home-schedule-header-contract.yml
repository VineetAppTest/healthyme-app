name: Update Member Home Schedule Header Contract

on:
  pull_request:
    types: [synchronize]
    paths:
      - "scripts/update_member_home_schedule_header_contract.py"
      - ".github/workflows/update-member-home-schedule-header-contract.yml"

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.pull_request.head.ref == 'fix/member-home-structural-header-shell' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/member-home-structural-header-shell
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply schedule-header test correction
        run: python scripts/update_member_home_schedule_header_contract.py
      - name: Run affected header and schedule tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest \
            tests.test_member_home_global_header_runtime \
            tests.test_member_home_schedule_presentation -v
      - name: Commit permanent test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_member_home_schedule_presentation.py
          git commit -m "Align schedule regression with structural Member Home header"
          git push origin HEAD:fix/member-home-structural-header-shell
