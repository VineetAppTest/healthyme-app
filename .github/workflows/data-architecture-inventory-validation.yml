name: Data architecture inventory validation

on:
  pull_request:
    paths:
      - "docs/healthyme_data_architecture_inventory_phase1_2026-08-03.md"
      - "tests/test_data_architecture_inventory_phase1.py"
      - ".github/workflows/data-architecture-inventory-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile inventory contract test
        run: python -m py_compile tests/test_data_architecture_inventory_phase1.py

      - name: Run inventory contract test
        run: python -m unittest tests.test_data_architecture_inventory_phase1 -v
