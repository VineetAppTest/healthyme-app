name: Issue 260 Profile Builder UI cleanup

on:
  pull_request:
    paths:
      - "pages/10_Admin_Dashboard.py"
      - "components/profile_builder_modular.py"
      - "tests/test_issue_260_profile_builder_ui_cleanup.py"
      - ".github/workflows/issue-260-profile-builder-ui-cleanup.yml"

permissions:
  contents: read

jobs:
  compile-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile changed Python files
        run: |
          python -m py_compile \
            pages/10_Admin_Dashboard.py \
            components/profile_builder_modular.py \
            tests/test_issue_260_profile_builder_ui_cleanup.py

      - name: Run Issue 260 UI cleanup contracts
        run: python -m unittest tests.test_issue_260_profile_builder_ui_cleanup -v
