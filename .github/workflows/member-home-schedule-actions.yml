name: Member Home Schedule Actions Validation

on:
  pull_request:
    paths:
      - "components/member_home_schedule_presentation.py"
      - "pages/02_Member_Home.py"
      - "pages/18_Daily_Log.py"
      - "components/db.py"
      - "tests/test_member_home_schedule_presentation.py"
      - ".github/workflows/member-home-schedule-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile schedule and journal presentation surfaces
        run: |
          python -m py_compile \
            components/member_home_schedule_presentation.py \
            pages/02_Member_Home.py \
            pages/18_Daily_Log.py \
            tests/test_member_home_schedule_presentation.py
      - name: Validate schedule, message grid and fluid time contracts
        run: python -m unittest tests.test_member_home_schedule_presentation -v
