name: Repository direct UI transform

on:
  push:
    branches:
      - fix/repository-direct-disclosure-and-form-layout
    paths:
      - 'scripts/apply_repository_direct_ui.py'
      - '.github/workflows/repository-direct-ui-transform.yml'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/repository-direct-disclosure-and-form-layout
          fetch-depth: 0

      - name: Apply direct page transformation
        run: python scripts/apply_repository_direct_ui.py

      - name: Remove one-time transformer
        run: |
          rm scripts/apply_repository_direct_ui.py
          rm .github/workflows/repository-direct-ui-transform.yml

      - name: Commit transformed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/__init__.py components/repository_page_ui.py pages/15_Admin_Recipe_Manager.py pages/16_Admin_Exercise_Manager.py pages/39_Admin_Supplement_Manager.py tests/test_repository_layout_correction_runtime.py scripts/apply_repository_direct_ui.py .github/workflows/repository-direct-ui-transform.yml
          git commit -m "Replace repository expanders with direct controls"
          git push origin HEAD:fix/repository-direct-disclosure-and-form-layout
