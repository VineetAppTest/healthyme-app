name: Apply repository exclusive section correction

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    paths:
      - '.github/workflows/repository-exclusive-section-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exclusive rendering and disclosure corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import indent

          def replace_once(text: str, old: str, new: str, path: Path) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")
              return text.replace(old, new, 1)

          runtime_path = Path('components/repository_layout_correction_runtime.py')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = replace_once(runtime, '_MARKER = "_hm_repository_layout_correction_v2"', '_MARKER = "_hm_repository_layout_correction_v3"', runtime_path)
          runtime = replace_once(
              runtime,
              'div[data-testid="stExpander"] summary::-webkit-details-marker{display:none!important;}\n'
              'div[data-testid="stExpander"] summary::marker{content:""!important;display:none!important;}',
              'div[data-testid="stExpander"] summary::-webkit-details-marker{display:none!important;font-size:0!important;}\n'
              'div[data-testid="stExpander"] summary::marker{content:""!important;display:none!important;color:transparent!important;font-size:0!important;}\n'
              'div[data-testid="stExpander"] summary > :not(p):not(:has(p)){\n'
              '  display:none!important;\n'
              '  width:0!important;\n'
              '  min-width:0!important;\n'
              '  height:0!important;\n'
              '  margin:0!important;\n'
              '  padding:0!important;\n'
              '  overflow:hidden!important;\n'
              '}\n'
              'div[data-testid="stExpander"] summary > p,\n'
              'div[data-testid="stExpander"] summary > :has(p){\n'
              '  display:block!important;\n'
              '  flex:1 1 auto!important;\n'
              '}',
              runtime_path,
          )
          runtime = runtime.replace('div[data-baseweb="tab-panel"]', 'div[data-testid="stVerticalBlockBorderWrapper"]:has(.hm-repository-form-scope)')
          runtime = replace_once(
              runtime,
              '  margin:.32rem 0 .10rem!important;\n  padding:.20rem .38rem!important;',
              '  margin:.36rem 0 .34rem!important;\n  padding:.20rem .38rem!important;\n  position:relative!important;\n  z-index:1!important;',
              runtime_path,
          )
          runtime = replace_once(
              runtime,
              '/* Keep one custom inline + / minus marker and suppress every native indicator. */',
              'div[data-testid="stSegmentedControl"]{margin:.10rem 0 .62rem!important;}\n\n/* Keep one custom inline + / minus marker and suppress every native indicator. */',
              runtime_path,
          )
          replacements = {
              'current_tabs = st.tabs': 'current_segmented_control = st.segmented_control',
              'getattr(current_tabs, _MARKER, False)': 'getattr(current_segmented_control, _MARKER, False)',
              '@functools.wraps(current_tabs)': '@functools.wraps(current_segmented_control)',
              'def tabs_with_repository_layout(*args, **kwargs):': 'def segmented_control_with_repository_layout(*args, **kwargs):',
              'return current_tabs(*args, **kwargs)': 'return current_segmented_control(*args, **kwargs)',
              '        tabs_with_repository_layout,': '        segmented_control_with_repository_layout,',
              '    st.tabs = tabs_with_repository_layout': '    st.segmented_control = segmented_control_with_repository_layout',
          }
          for old, new in replacements.items():
              runtime = replace_once(runtime, old, new, runtime_path)
          if 'data-baseweb="tab-panel"' in runtime or 'current_tabs' in runtime or 'tabs_with_repository_layout' in runtime:
              raise RuntimeError('Runtime still contains retired tab-based layout hooks')
          runtime_path.write_text(runtime, encoding='utf-8')

          def transform_page(path_str: str, kind: str, add_label: str, edit_key: str, delete_key: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              old_tabs = f'repository_tab, add_tab = st.tabs(["Current Repository", "{add_label}"])\n\nwith repository_tab:\n'
              new_switch = (
                  'section = st.segmented_control(\n'
                  '    "Repository section",\n'
                  f'    ["Current Repository", "{add_label}"],\n'
                  '    default="Current Repository",\n'
                  f'    key="hm_{kind}_repository_section",\n'
                  '    label_visibility="collapsed",\n'
                  '    width="stretch",\n'
                  ')\n'
                  f'if section == "{add_label}":\n'
                  f'    st.session_state.pop("{edit_key}", None)\n'
                  f'    st.session_state.pop("{delete_key}", None)\n\n'
                  'if section == "Current Repository":\n'
              )
              text = replace_once(text, old_tabs, new_switch, path)
              add_marker = '\nwith add_tab:\n'
              start = text.find(add_marker)
              if start < 0:
                  raise RuntimeError(f'{path}: Add tab block not found')
              end = text.find('\nrender_page_nav(', start)
              if end < 0:
                  raise RuntimeError(f'{path}: render_page_nav boundary not found')
              body = text[start + len(add_marker):end]
              wrapped = (
                  f'\nif section == "{add_label}":\n'
                  '    with st.container(border=True):\n'
                  '        st.markdown(\n'
                  '            "<span class=\'hm-repository-form-scope\'></span>",\n'
                  '            unsafe_allow_html=True,\n'
                  '        )\n'
                  + indent(body, '    ')
              )
              text = text[:start] + wrapped + text[end:]
              if 'st.tabs(' in text or 'with repository_tab:' in text or 'with add_tab:' in text:
                  raise RuntimeError(f'{path}: retired tab rendering remains')
              path.write_text(text, encoding='utf-8')

          transform_page('pages/15_Admin_Recipe_Manager.py', 'recipe', 'Add Recipe', 'hm_recipe_repository_edit_index', 'hm_recipe_repository_delete_index')
          transform_page('pages/16_Admin_Exercise_Manager.py', 'exercise', 'Add Exercise', 'hm_exercise_repository_edit_id', 'hm_exercise_repository_delete_id')
          transform_page('pages/39_Admin_Supplement_Manager.py', 'supplement', 'Add Supplement', 'hm_supplement_repository_edit_id', 'hm_supplement_repository_delete_id')

          consolidation_path = Path('tests/test_repository_consolidation.py')
          consolidation = consolidation_path.read_text(encoding='utf-8')
          old_test = '''    def test_each_page_exposes_only_repository_and_add_sections(self):
        self.assertIn('st.tabs(["Current Repository", "Add Recipe"])', self.recipe)
        self.assertIn('st.tabs(["Current Repository", "Add Exercise"])', self.exercise)
        self.assertIn('st.tabs(["Current Repository", "Add Supplement"])', self.supplement)
'''
          new_test = '''    def test_each_page_exposes_only_one_repository_section_at_a_time(self):
        cases = (
            (self.recipe, "Add Recipe"),
            (self.exercise, "Add Exercise"),
            (self.supplement, "Add Supplement"),
        )
        for source, add_label in cases:
            self.assertIn("st.segmented_control(", source)
            self.assertIn(f'["Current Repository", "{add_label}"]', source)
            self.assertIn('if section == "Current Repository":', source)
            self.assertIn(f'if section == "{add_label}":', source)
            self.assertIn("hm-repository-form-scope", source)
            self.assertNotIn("st.tabs(", source)
'''
          consolidation = replace_once(consolidation, old_test, new_test, consolidation_path)
          consolidation_path.write_text(consolidation, encoding='utf-8')

          layout_test_path = Path('tests/test_repository_layout_correction_runtime.py')
          layout_test = layout_test_path.read_text(encoding='utf-8')
          layout_test = replace_once(
              layout_test,
              "        self.assertIn('summary [class*=\"material-symbols\"]', source)\n",
              "        self.assertIn('summary [class*=\"material-symbols\"]', source)\n        self.assertIn('summary > :not(p):not(:has(p))', source)\n        self.assertIn('color:transparent!important', source)\n",
              layout_test_path,
          )
          layout_test = replace_once(
              layout_test,
              "        self.assertIn('padding:.58rem .68rem!important;', source)\n",
              "        self.assertIn('padding:.58rem .68rem!important;', source)\n        self.assertIn('margin:.36rem 0 .34rem!important;', source)\n        self.assertIn('.hm-repository-form-scope', source)\n",
              layout_test_path,
          )
          anchor = '    def test_runtime_is_installed_outermost(self):\n'
          exclusive_test = '''    def test_runtime_uses_exclusive_segmented_control_instead_of_tabs(self):
        source = text(RUNTIME)
        self.assertIn("current_segmented_control = st.segmented_control", source)
        self.assertIn("st.segmented_control = segmented_control_with_repository_layout", source)
        self.assertNotIn("current_tabs", source)
        self.assertNotIn("tabs_with_repository_layout", source)

'''
          layout_test = replace_once(layout_test, anchor, exclusive_test + anchor, layout_test_path)
          layout_test_path.write_text(layout_test, encoding='utf-8')
          PY

      - name: Compile changed files
        run: |
          python -m py_compile \
            components/repository_layout_correction_runtime.py \
            pages/15_Admin_Recipe_Manager.py \
            pages/16_Admin_Exercise_Manager.py \
            pages/39_Admin_Supplement_Manager.py \
            tests/test_repository_consolidation.py \
            tests/test_repository_layout_correction_runtime.py

      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components pages tests
          git commit -m "Render one repository section at a time"
          git push origin HEAD:${{ github.head_ref }}
