name: Content repository standardization validation

on:
  pull_request:
    paths:
      - "components/__init__.py"
      - "components/content_repository_store.py"
      - "components/content_repository_migration.py"
      - "components/recommendation_contract.py"
      - "components/recipe_repository.py"
      - "components/exercise_repository.py"
      - "components/supplement_repository.py"
      - "pages/08_Recipe_Repository.py"
      - "pages/09_Exercise_Repository.py"
      - "pages/15_Admin_Recipe_Manager.py"
      - "supabase/migrations/*content_repository*.sql"
      - "tests/test_content_repository_standardization.py"
      - "tests/test_content_repository_privilege_hardening.py"
      - "tests/test_content_repository_controlled_backfill.py"
      - "tests/test_recipe_repository_canonical_cutover.py"
      - "tests/test_exercise_repository_canonical_cutover.py"
      - "tests/test_exercise_journal_repository_fix_contract.py"
      - "tests/test_supplement_repository_canonical_cutover.py"
      - "tests/test_supplement_repository_separation.py"
      - "tests/test_content_repository_legacy_retirement.py"
      - "docs/content_repository_standardization.md"
      - "docs/content_repository_source_inventory_2026-08-03.md"
      - "docs/content_repository_legacy_retirement_2026-08-03.md"
      - ".github/workflows/content-repository-standardization-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile repository foundation and live cutovers
        run: |
          python -m py_compile \
            components/content_repository_store.py \
            components/content_repository_migration.py \
            components/recommendation_contract.py \
            components/recipe_repository.py \
            components/exercise_repository.py \
            components/supplement_repository.py \
            pages/08_Recipe_Repository.py \
            pages/09_Exercise_Repository.py \
            pages/15_Admin_Recipe_Manager.py \
            tests/test_content_repository_standardization.py \
            tests/test_content_repository_privilege_hardening.py \
            tests/test_content_repository_controlled_backfill.py \
            tests/test_recipe_repository_canonical_cutover.py \
            tests/test_exercise_repository_canonical_cutover.py \
            tests/test_exercise_journal_repository_fix_contract.py \
            tests/test_supplement_repository_canonical_cutover.py \
            tests/test_supplement_repository_separation.py \
            tests/test_content_repository_legacy_retirement.py

      - name: Run repository foundation tests
        run: |
          python -m unittest tests.test_content_repository_standardization -v
          python -m unittest tests.test_content_repository_privilege_hardening -v
          python -m unittest tests.test_content_repository_controlled_backfill -v

      - name: Run Recipe canonical cutover tests
        run: python -m unittest tests.test_recipe_repository_canonical_cutover -v

      - name: Run Exercise canonical cutover tests
        run: |
          python -m unittest tests.test_exercise_repository_canonical_cutover -v
          python -m unittest tests.test_exercise_journal_repository_fix_contract -v

      - name: Run Supplement canonical cutover tests
        run: |
          python -m unittest tests.test_supplement_repository_canonical_cutover -v
          python -m unittest tests.test_supplement_repository_separation -v

      - name: Run legacy authority retirement guard
        run: python -m unittest tests.test_content_repository_legacy_retirement -v
