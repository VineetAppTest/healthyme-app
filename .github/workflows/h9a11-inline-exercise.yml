name: H9A11 inline Exercise Journal

on:
  push:
    branches:
      - member-exercise-inline-journal
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, '[h9a11-inline-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-exercise-inline-journal
          fetch-depth: 0

      - name: Render exercise journal directly in Daily Log tab
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pages/18_Daily_Log.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from components.flash import set_system_message, render_system_message\n'
          import_line = 'from components.member_exercise_view import render_member_exercise_journal\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = '''def _render_exercise_journal_placeholder():
    st.markdown("### Exercise Journal")
    st.markdown(
        """
        <div class='hm-exercise-placeholder'>
          View today's prescribed exercises and record status, completion time and member notes.
        </div>
        """,
        unsafe_allow_html=True,
    )
    if st.button("Open My Exercise", type="primary", use_container_width=True, key="hm_open_member_exercise"):
        st.switch_page("pages/41_Member_Exercise.py")
'''
          new = '''def _render_exercise_journal():
    render_member_exercise_journal(key_prefix="daily_log_exercise")
'''
          if old not in text:
              raise SystemExit('Redirect block not found')
          text = text.replace(old, new, 1)

          old_call = '    _render_exercise_journal_placeholder()\n'
          new_call = '    _render_exercise_journal()\n'
          if old_call not in text:
              raise SystemExit('Placeholder call not found')
          text = text.replace(old_call, new_call, 1)

          for token in ('Open My Exercise', '_render_exercise_journal_placeholder', 'st.switch_page("pages/41_Member_Exercise.py")'):
              if token in text:
                  raise SystemExit(f'Redirect token remains: {token}')
          if 'render_member_exercise_journal(key_prefix="daily_log_exercise")' not in text:
              raise SystemExit('Inline journal call missing')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python files
        run: |
          python -m py_compile \
            pages/18_Daily_Log.py \
            pages/41_Member_Exercise.py \
            components/member_exercise_journal.py \
            components/member_exercise_view.py

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/h9a11-inline-exercise.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/18_Daily_Log.py .github/workflows/h9a11-inline-exercise.yml
          git commit -m "Render Exercise Journal inline [h9a11-inline-done]"
          git push origin HEAD:member-exercise-inline-journal
