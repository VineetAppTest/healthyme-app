name: Apply Authenticated Member Follow-up

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_authenticated_member_followup.py"
      - "tests/test_member_home_schedule_presentation.py"
      - ".github/workflows/apply-authenticated-member-followup.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/authenticated-smoke-corrections-live' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/authenticated-smoke-corrections-live
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact follow-up patch
        run: python scripts/apply_authenticated_member_followup.py
      - name: Compile changed surfaces
        run: |
          python -m py_compile \
            components/member_home_side_by_side_runtime.py \
            components/member_home_schedule_presentation.py \
            components/daily_log_widget_route_preservation.py \
            pages/02_Member_Home.py \
            pages/18_Daily_Log.py \
            tests/test_authenticated_member_followup_corrections.py \
            tests/test_food_journal_meal_grid_saved_days_cleanup.py \
            tests/test_member_home_schedule_presentation.py
      - name: Run focused follow-up contracts
        run: |
          python -m unittest \
            tests.test_authenticated_member_followup_corrections \
            tests.test_food_journal_meal_grid_saved_days_cleanup \
            tests.test_authenticated_smoke_corrections \
            tests.test_member_home_schedule_presentation \
            tests.test_member_home_global_header_runtime \
            tests.test_member_journal_server_autosave \
            -v
      - name: Commit permanent corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/member_home_side_by_side_runtime.py \
            components/member_home_schedule_presentation.py \
            components/daily_log_widget_route_preservation.py \
            pages/02_Member_Home.py \
            pages/18_Daily_Log.py \
            tests/test_authenticated_member_followup_corrections.py \
            tests/test_food_journal_meal_grid_saved_days_cleanup.py
          git commit -m "Correct authenticated Member follow-up regressions"
          git push origin HEAD:fix/authenticated-smoke-corrections-live
