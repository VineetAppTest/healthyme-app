name: Member Visual Smoke Follow-up Validation

on:
  pull_request:
    paths:
      - "components/member_home_global_header_runtime.py"
      - "components/member_home_schedule_presentation.py"
      - "components/food_saved_days_presentation.py"
      - "components/schedule_timezone_ui.py"
      - "pages/02_Member_Home.py"
      - "pages/18_Daily_Log.py"
      - "tests/test_member_visual_smoke_followup.py"
      - ".github/workflows/member-visual-smoke-followup-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile corrected Member surfaces
        run: |
          python -m py_compile \
            components/member_home_global_header_runtime.py \
            components/member_home_schedule_presentation.py \
            components/food_saved_days_presentation.py \
            components/schedule_timezone_ui.py \
            pages/02_Member_Home.py \
            pages/18_Daily_Log.py \
            tests/test_member_visual_smoke_followup.py
      - name: Run focused Member visual contracts
        run: python -m unittest tests.test_member_visual_smoke_followup -v
