name: Apply Food Saved Days Hydration Grid Patch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_food_saved_days_hydration_grid_patch.py"
      - ".github/workflows/apply-food-saved-days-hydration-grid.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/food-saved-days-today-hydration-grid' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/food-saved-days-today-hydration-grid
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact Daily Log patch
        run: python scripts/apply_food_saved_days_hydration_grid_patch.py
      - name: Compile changed surfaces
        run: |
          python -m py_compile \
            components/food_saved_days_presentation.py \
            pages/18_Daily_Log.py \
            tests/test_food_saved_days_presentation.py
      - name: Run focused validation
        run: python -m unittest tests.test_food_saved_days_presentation -v
      - name: Commit Daily Log wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/18_Daily_Log.py
          git commit -m "Wire Food Journal saved-day hydration cards"
          git push origin HEAD:fix/food-saved-days-today-hydration-grid
