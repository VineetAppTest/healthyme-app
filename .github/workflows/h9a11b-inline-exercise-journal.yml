name: H9A11B inline exercise journal

on:
  push:
    branches:
      - h9a11b-inline-exercise-journal

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[h9a11b-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h9a11b-inline-exercise-journal
          fetch-depth: 0

      - name: Render Exercise Journal inline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pages/18_Daily_Log.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from components.guards import require_member\n'
          import_line = 'from components.member_exercise_journal import render_member_exercise_journal\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Daily Log import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_function = '''def _render_exercise_journal_placeholder():
              st.markdown("### Exercise Journal")
              st.markdown(
                  """
                  <div class='hm-exercise-placeholder'>
                    View today's prescribed exercises and record status, completion time and member notes.
                  </div>
                  """,
                  unsafe_allow_html=True,
              )
              if st.button("Open My Exercise", type="primary", use_container_width=True, key="hm_open_member_exercise"):
                  st.switch_page("pages/41_Member_Exercise.py")
          '''
          new_function = '''def _render_exercise_journal(user_id):
              member_email = (
                  st.session_state.get("user_email")
                  or st.session_state.get("email")
                  or ""
              )
              render_member_exercise_journal(
                  user_id,
                  member_email,
                  heading="Exercise Journal",
                  key_prefix="hm_daily_log_exercise",
              )
          '''
          if old_function not in text:
              raise SystemExit('Existing Exercise Journal placeholder block not found')
          text = text.replace(old_function, new_function, 1)

          old_call = '    _render_exercise_journal_placeholder()\n'
          new_call = '    _render_exercise_journal(user_id)\n'
          if old_call not in text:
              raise SystemExit('Exercise Journal placeholder call not found')
          text = text.replace(old_call, new_call, 1)

          old_topbar = 'topbar("Daily Log", "Capture food updates and open your prescribed exercise journal.", "Member tracker")'
          new_topbar = 'topbar("Daily Log", "Capture food and exercise updates for one day.", "Member tracker")'
          if old_topbar in text:
              text = text.replace(old_topbar, new_topbar, 1)

          if 'Open My Exercise' in text:
              raise SystemExit('Intermediate Open My Exercise action remains in Daily Log')
          if 'render_member_exercise_journal(' not in text:
              raise SystemExit('Inline Exercise Journal renderer is missing')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate affected Python files
        run: |
          python -m py_compile \
            pages/18_Daily_Log.py \
            pages/41_Member_Exercise.py \
            components/member_exercise_journal.py
          python - <<'PY'
          from pathlib import Path

          daily_log = Path('pages/18_Daily_Log.py').read_text(encoding='utf-8')
          standalone = Path('pages/41_Member_Exercise.py').read_text(encoding='utf-8')
          component = Path('components/member_exercise_journal.py').read_text(encoding='utf-8')

          assert 'Open My Exercise' not in daily_log
          assert '_render_exercise_journal(user_id)' in daily_log
          assert 'render_member_exercise_journal(' in daily_log
          assert 'render_member_exercise_journal(' in standalone
          assert 'def render_member_exercise_journal(' in component
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/h9a11b-inline-exercise-journal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/18_Daily_Log.py .github/workflows/h9a11b-inline-exercise-journal.yml
          git commit -m "Render Exercise Journal directly in Daily Log [h9a11b-integrated]"
          git push origin HEAD:h9a11b-inline-exercise-journal
