name: Apply Member Home Schedule Dedupe Hotfix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_member_home_schedule_dedupe_hotfix.py"
      - ".github/workflows/apply-member-home-schedule-dedupe-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'hotfix/member-home-duplicate-schedule-actions' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/member-home-duplicate-schedule-actions
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact hotfix
        run: python scripts/apply_member_home_schedule_dedupe_hotfix.py
      - name: Compile changed surfaces
        run: |
          python -m py_compile \
            components/member_home_schedule_presentation.py \
            tests/test_member_home_schedule_presentation.py
      - name: Run focused schedule validation
        run: python -m unittest tests.test_member_home_schedule_presentation -v
      - name: Commit permanent hotfix files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/member_home_schedule_presentation.py tests/test_member_home_schedule_presentation.py
          git commit -m "Prevent duplicate Member Home schedule action keys"
          git push origin HEAD:hotfix/member-home-duplicate-schedule-actions
