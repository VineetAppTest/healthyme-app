name: Streamlit Member Planning acceptance

on:
  pull_request:
    paths:
      - "components/profile_builder_modular.py"
      - "components/profile_builder_allocation_workspace.py"
      - "components/meal_profile_builder_phase_b.py"
      - "components/meal_profile_builder_write_boundary.py"
      - "components/exercise_member_allocation.py"
      - "components/supplement_member_allocation.py"
      - "components/current_member_plan.py"
      - "components/current_member_plan_view.py"
      - "pages/10_Admin_Dashboard.py"
      - "pages/38_Admin_Recommendation_Profile_Builder.py"
      - "pages/42_Admin_Exercise_Member_Allocation.py"
      - "pages/43_Admin_Supplement_Member_Allocation.py"
      - "pages/36_Todays_Journey.py"
      - "pages/37_Member_Plan.py"
      - "tests/test_meal_profile_builder_phase_b.py"
      - "tests/test_exercise_member_allocation.py"
      - "tests/test_supplement_member_allocation.py"
      - "tests/test_current_member_plan.py"
      - "docs/streamlit_member_planning_acceptance_2026-08-04.md"
      - ".github/workflows/streamlit-member-planning-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Streamlit Member Planning routes
        run: |
          python -m py_compile \
            components/profile_builder_modular.py \
            components/profile_builder_allocation_workspace.py \
            components/meal_profile_builder_phase_b.py \
            pages/10_Admin_Dashboard.py \
            pages/38_Admin_Recommendation_Profile_Builder.py \
            pages/42_Admin_Exercise_Member_Allocation.py \
            pages/43_Admin_Supplement_Member_Allocation.py \
            components/current_member_plan.py \
            components/current_member_plan_view.py \
            pages/36_Todays_Journey.py \
            pages/37_Member_Plan.py

      - name: Run Member Planning acceptance regressions
        run: |
          python -m unittest -v \
            tests.test_meal_profile_builder_phase_b \
            tests.test_exercise_member_allocation \
            tests.test_supplement_member_allocation \
            tests.test_current_member_plan \
            tests.test_member_planning_separation_contract \
            tests.test_form_reset_closure_inventory_v2
