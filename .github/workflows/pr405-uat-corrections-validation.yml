name: PR 405 UAT Corrections Validation

on:
  pull_request:
    paths:
      - "app.py"
      - "components/member_home_global_header_runtime.py"
      - "components/member_plan_builder_setup.py"
      - "components/member_plan_builder_meals_compact.py"
      - "components/member_plan_builder_exercise.py"
      - "components/member_plan_builder_supplement.py"
      - "native_bridge/native_bridge_full_member_app.py"
      - "pages/18_Daily_Log.py"
      - "tests/test_pr405_uat_corrections.py"
      - "tests/test_admin_plan_builder_ui_followup.py"
      - "tests/test_exercise_native_router_rerun_retention.py"
      - ".github/workflows/pr405-uat-corrections-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile corrected surfaces
        run: |
          python -m py_compile \
            app.py \
            components/member_home_global_header_runtime.py \
            components/member_plan_builder_setup.py \
            components/member_plan_builder_meals_compact.py \
            components/member_plan_builder_exercise.py \
            components/member_plan_builder_supplement.py \
            native_bridge/native_bridge_full_member_app.py \
            pages/18_Daily_Log.py
      - name: Run focused UAT correction contracts
        run: |
          python -m unittest \
            tests.test_pr405_uat_corrections \
            tests.test_admin_plan_builder_ui_followup \
            tests.test_exercise_native_router_rerun_retention \
            tests.test_member_home_global_header_runtime \
            tests.test_authenticated_smoke_corrections \
            tests.test_food_journal_meal_grid_saved_days_cleanup \
            tests.test_streamlit_ui_consistency_batch \
            -v
