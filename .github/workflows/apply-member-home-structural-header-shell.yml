name: Apply Member Home Structural Header Shell

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_member_home_structural_header_shell.py"
      - ".github/workflows/apply-member-home-structural-header-shell.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/member-home-structural-header-shell' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/member-home-structural-header-shell
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact structural correction
        run: python scripts/apply_member_home_structural_header_shell.py
      - name: Compile corrected surfaces
        run: |
          python -m py_compile \
            components/member_home_global_header_runtime.py \
            pages/02_Member_Home.py \
            tests/test_member_home_global_header_runtime.py
      - name: Run focused header validation
        run: python -m unittest tests.test_member_home_global_header_runtime -v
      - name: Commit permanent correction files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/member_home_global_header_runtime.py \
            pages/02_Member_Home.py \
            tests/test_member_home_global_header_runtime.py
          git commit -m "Use one structural Member Home header shell"
          git push origin HEAD:fix/member-home-structural-header-shell
