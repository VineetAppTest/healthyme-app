name: Apply Admin Plan Builder UI Follow-up

on:
  push:
    branches:
      - fix/admin-plan-builder-ui-followup-aug05
    paths:
      - scripts/apply_admin_plan_builder_ui_followup.py
      - .github/workflows/apply-admin-plan-builder-ui-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-plan-builder-ui-followup-aug05
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply focused patch
        run: python scripts/apply_admin_plan_builder_ui_followup.py
      - name: Validate syntax
        run: |
          python -m py_compile \
            components/member_plan_builder_meals_compact.py \
            components/member_plan_builder_export.py \
            components/member_plan_builder_exercise.py \
            components/member_plan_builder_supplement.py
      - name: Commit applied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/member_plan_builder_meals_compact.py \
            components/member_plan_builder_export.py \
            components/member_plan_builder_exercise.py \
            components/member_plan_builder_supplement.py
          git diff --cached --quiet && exit 0
          git commit -m "Refine Admin plan builder detail and allocation UI"
          git push origin HEAD:fix/admin-plan-builder-ui-followup-aug05
