name: Apply Food Journal Meal Grid and Saved Days Cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/apply_food_journal_meal_grid_saved_days_cleanup.py"
      - ".github/workflows/apply-food-journal-meal-grid-saved-days-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/food-journal-meal-grid-saved-days-cleanup' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/food-journal-meal-grid-saved-days-cleanup
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply exact correction
        run: python scripts/apply_food_journal_meal_grid_saved_days_cleanup.py
      - name: Compile corrected surfaces
        run: |
          python -m py_compile \
            pages/18_Daily_Log.py \
            components/member_saved_days_dispatch_runtime.py \
            components/member_saved_days_home_cleanup.py \
            tests/test_food_journal_meal_grid_saved_days_cleanup.py
      - name: Run focused validation
        run: python -m unittest tests.test_food_journal_meal_grid_saved_days_cleanup -v
      - name: Commit permanent correction files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pages/18_Daily_Log.py \
            components/member_saved_days_home_cleanup.py
          git commit -m "Restructure Food Journal meal rows and retire duplicate Saved Days summary"
          git push origin HEAD:fix/food-journal-meal-grid-saved-days-cleanup
