name: Package hardening validation

on:
  pull_request:
    paths:
      - "components/package_hardening*.py"
      - "components/package_value_formula_ui.py"
      - "components/admin_performance_optimization.py"
      - "components/admin_uiux_corrections.py"
      - "components/admin_scheduling*.py"
      - "components/daily_guidance_today_default.py"
      - "components/form_hygiene.py"
      - "components/login_expiry_recovery.py"
      - "components/member_message_display_cleanup.py"
      - "components/member_home_schedule_presentation.py"
      - "components/performance_diagnostics.py"
      - "components/performance_measurement_gate.py"
      - "components/sprint1_schedule_hygiene.py"
      - "components/current_build.py"
      - "components/__init__.py"
      - "pages/10_Admin_Dashboard.py"
      - "pages/31_Admin_Member_Communication.py"
      - "pages/32_Admin_Scheduling.py"
      - "pages/33_My_Schedule.py"
      - "pages/38_Admin_Recommendation_Profile_Builder.py"
      - "pages/41_Admin_Packages.py"
      - "pages/47_Admin_Performance_Diagnostics.py"
      - "sql/package_hardening_123*.sql"
      - "tests/test_package_hardening_contract.py"
      - "tests/test_ui_corrections_ss1_ss3.py"
      - "tests/test_sprint1_stability_hygiene.py"
      - "tests/test_admin_scheduling_consolidated.py"
      - "tests/test_performance_measurement_only.py"
      - "tests/test_admin_performance_optimization.py"
      - "tests/test_admin_uiux_corrections.py"
      - "tests/test_member_performance_export.py"
      - "tests/test_member_home_schedule_presentation.py"
      - ".github/workflows/package-hardening-validation.yml"

permissions:
  contents: read

jobs:
  compile-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            components/__init__.py \
            components/current_build.py \
            components/daily_guidance_today_default.py \
            components/form_hygiene.py \
            components/login_expiry_recovery.py \
            components/member_message_display_cleanup.py \
            components/member_home_schedule_presentation.py \
            components/performance_diagnostics.py \
            components/performance_measurement_gate.py \
            components/admin_performance_optimization.py \
            components/admin_uiux_corrections.py \
            components/sprint1_schedule_hygiene.py \
            components/package_hardening.py \
            components/package_hardening_bootstrap.py \
            components/package_hardening_ui.py \
            components/package_hardening_schedule_ui.py \
            components/package_value_formula_ui.py \
            components/admin_scheduling_default_navigation.py \
            components/admin_scheduling_timezone_selector.py \
            components/admin_scheduling_consolidated.py \
            pages/10_Admin_Dashboard.py \
            pages/31_Admin_Member_Communication.py \
            pages/32_Admin_Scheduling.py \
            pages/33_My_Schedule.py \
            pages/38_Admin_Recommendation_Profile_Builder.py \
            pages/41_Admin_Packages.py \
            pages/47_Admin_Performance_Diagnostics.py

      - name: Verify component imports
        run: |
          python - <<'PY'
          import components
          import components.daily_guidance_today_default
          import components.form_hygiene
          import components.login_expiry_recovery
          import components.member_message_display_cleanup
          import components.member_home_schedule_presentation
          import components.performance_diagnostics
          import components.performance_measurement_gate
          import components.admin_performance_optimization
          import components.admin_uiux_corrections
          import components.sprint1_schedule_hygiene
          import components.package_hardening
          import components.package_hardening_ui
          import components.package_hardening_schedule_ui
          import components.package_value_formula_ui
          import components.admin_scheduling_default_navigation
          import components.admin_scheduling_timezone_selector
          import components.admin_scheduling_consolidated
          print("Package hardening, Scheduling, diagnostics, performance, Member schedule/export and Admin UI UX imports passed")
          PY

      - name: Run package and UI contract tests
        run: |
          python -m unittest \
            tests.test_package_hardening_contract \
            tests.test_ui_corrections_ss1_ss3 \
            tests.test_sprint1_stability_hygiene \
            tests.test_admin_scheduling_consolidated \
            tests.test_performance_measurement_only \
            tests.test_admin_performance_optimization \
            tests.test_admin_uiux_corrections \
            tests.test_member_performance_export \
            tests.test_member_home_schedule_presentation \
            -v
