name: Authenticated Smoke Corrections Validation

on:
  pull_request:
    paths:
      - "components/admin_schedule_feedback_aug04.py"
      - "components/daily_log_widget_route_preservation.py"
      - "components/member_home_global_header_runtime.py"
      - "components/member_home_schedule_presentation.py"
      - "components/member_home_side_by_side_runtime.py"
      - "components/member_plan_builder_meals_compact.py"
      - "components/member_plan_builder_setup.py"
      - "components/member_plan_builder_view_compact.py"
      - "components/profile_builder_modular.py"
      - "pages/02_Member_Home.py"
      - "pages/15_Admin_Recipe_Manager.py"
      - "pages/16_Admin_Exercise_Manager.py"
      - "pages/18_Daily_Log.py"
      - "pages/38_Admin_Recommendation_Profile_Builder.py"
      - "pages/39_Admin_Supplement_Manager.py"
      - "tests/test_authenticated_member_followup_corrections.py"
      - "tests/test_authenticated_smoke_corrections.py"
      - "tests/test_food_journal_meal_grid_saved_days_cleanup.py"
      - "tests/test_member_home_global_header_runtime.py"
      - "tests/test_member_home_schedule_presentation.py"
      - "tests/test_streamlit_ui_consistency_batch.py"
      - ".github/workflows/authenticated-smoke-corrections-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile corrected surfaces
        run: |
          python -m py_compile \
            components/admin_schedule_feedback_aug04.py \
            components/daily_log_widget_route_preservation.py \
            components/member_home_global_header_runtime.py \
            components/member_home_schedule_presentation.py \
            components/member_home_side_by_side_runtime.py \
            components/member_plan_builder_meals_compact.py \
            components/member_plan_builder_setup.py \
            components/member_plan_builder_view_compact.py \
            components/profile_builder_modular.py \
            pages/02_Member_Home.py \
            pages/15_Admin_Recipe_Manager.py \
            pages/16_Admin_Exercise_Manager.py \
            pages/18_Daily_Log.py \
            pages/38_Admin_Recommendation_Profile_Builder.py \
            pages/39_Admin_Supplement_Manager.py \
            tests/test_authenticated_member_followup_corrections.py \
            tests/test_authenticated_smoke_corrections.py \
            tests/test_food_journal_meal_grid_saved_days_cleanup.py \
            tests/test_member_home_global_header_runtime.py \
            tests/test_member_home_schedule_presentation.py \
            tests/test_streamlit_ui_consistency_batch.py
      - name: Run authenticated smoke correction contracts
        run: |
          python -m unittest \
            tests.test_authenticated_member_followup_corrections \
            tests.test_authenticated_smoke_corrections \
            tests.test_streamlit_ui_consistency_batch \
            tests.test_food_journal_meal_grid_saved_days_cleanup \
            tests.test_member_home_global_header_runtime \
            tests.test_member_home_schedule_presentation \
            tests.test_meal_profile_builder_phase_b \
            tests.test_feedback_scheduling_notifications_task_age \
            tests.test_repository_layout_correction_runtime \
            tests.test_member_journal_server_autosave \
            -v
