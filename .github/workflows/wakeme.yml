name: WakeMe - Keep HealthyMe Warm

on:
  schedule:
    # Runs around every 10 minutes, avoiding :00 where GitHub Actions load is often higher.
    # GitHub cron runs in UTC.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wakeme-healthyme-warm
  cancel-in-progress: false

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Wake HealthyMe app
        env:
          # Preferred: add this as a GitHub repository secret.
          # Repo → Settings → Secrets and variables → Actions → New repository secret
          # Name: HEALTHYME_APP_URL
          # Value: your deployed Streamlit app URL
          HEALTHYME_APP_URL: ${{ secrets.HEALTHYME_APP_URL }}
        run: |
          set -e

          if [ -z "$HEALTHYME_APP_URL" ]; then
            echo "HEALTHYME_APP_URL secret is missing."
            echo "Add it under GitHub repo → Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "Pinging HealthyMe app: $HEALTHYME_APP_URL"

          curl --fail --silent --show-error --location --max-time 60 --retry 3 --retry-delay 5 "$HEALTHYME_APP_URL" > /dev/null

          echo "HealthyMe wake ping completed successfully."
