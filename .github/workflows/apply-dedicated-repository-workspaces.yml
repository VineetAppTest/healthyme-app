name: Apply dedicated repository workspaces

on:
  push:
    branches:
      - feature/dedicated-repository-workspaces
    paths:
      - scripts/apply_dedicated_repository_workspaces.py
      - .github/workflows/apply-dedicated-repository-workspaces.yml

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dedicated-repository-workspaces
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply workspace transformation
        run: python scripts/apply_dedicated_repository_workspaces.py
      - name: Compile transformed pages
        run: |
          python -m py_compile \
            components/repository_workspace_common.py \
            pages/15_Admin_Recipe_Manager.py \
            pages/15A_Admin_Recipe_Form.py \
            pages/16_Admin_Exercise_Manager.py \
            pages/16A_Admin_Exercise_Form.py \
            pages/39_Admin_Supplement_Manager.py \
            pages/39A_Admin_Supplement_Form.py
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components pages
          if git diff --cached --quiet; then
            echo "No transformed changes to commit"
          else
            git commit -m "Apply dedicated repository workspaces"
            git push origin HEAD:feature/dedicated-repository-workspaces
          fi
